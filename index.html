<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Disciplinar</title>

<link rel="icon" href="brasao.png">
<link rel="apple-touch-icon" sizes="180x180" href="brasao.png">

<style>
:root{
--verde:#2e3b2f;
--vermelho:#8b0000;
--laranja:#d17a00;
--azul:#004d80;
--roxo:#6a0dad;
--cinza:#f4f4f4;
}

body{
margin:0;
font-family:Arial;
background:var(--cinza);
}

/* LOGIN */

#login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:var(--verde);
}

.login-box{
background:white;
padding:30px;
width:95%;
max-width:400px;
border-radius:8px;
text-align:center;
}

input, button{
width:100%;
padding:8px;
margin:6px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:var(--verde);
color:white;
font-weight:bold;
border:none;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

/* APP */

#app{display:none;padding:15px;}

.topbar{
background:var(--verde);
color:white;
padding:10px;
border-radius:6px;
text-align:center;
font-weight:bold;
}

.dashboard{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.box{
flex:1;
min-width:120px;
background:white;
padding:8px;
border-radius:6px;
text-align:center;
font-size:13px;
}

.card{
background:white;
padding:10px;
margin-top:8px;
border-radius:6px;
}

.vencido{border-left:6px solid var(--vermelho);}
.amanha{border-left:6px solid var(--laranja);}
.venceHoje{border-left:6px solid green;background:#e8f5e9;}
.prazo{border-left:6px solid gold;}
.aguardando{border-left:6px solid var(--azul);}
.fiod{border-left:6px solid var(--roxo);}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">

<div style="display:flex;align-items:center;justify-content:center;gap:10px;">
<img src="brasao.png" style="width:45px;">
<h2 style="margin:0;">Controle Disciplinar</h2>
</div>

<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="entrar()">Entrar</button>

<div style="color:#8b0000;font-weight:bold;margin-top:10px;">
Acesso restrito – uso interno
</div>

</div>
</div>

<!-- APP -->
<div id="app">

<div class="topbar">Painel Disciplinar</div>

<div style="margin-top:10px;">
<button onclick="exportarBackup()">📥 Exportar Backup</button>
<button onclick="document.getElementById('importarArquivo').click()">📤 Importar Backup</button>
<input type="file" id="importarArquivo" style="display:none" accept=".json" onchange="importarBackup(event)">
</div>

<div class="dashboard" id="dashboard"></div>

<div style="margin-top:10px;">
<button onclick="modo='ativos';carregar()">Ver Ativos</button>
<button onclick="modo='historico';carregar()">Ver Histórico</button>
</div>

<div style="display:flex;gap:5px;margin-top:10px;">
<input id="busca" placeholder="Buscar por Nr ou Nome">
<button onclick="carregar()">Buscar</button>
<button onclick="limparBusca()" style="background:#8b0000;">Limpar</button>
</div>

<h3>Novo Registro FAFD</h3>
<input id="nr" placeholder="Nr do Aluno">
<input id="nome" placeholder="Nome">
<input id="turma" placeholder="Turma">
<input type="date" id="data">
<button onclick="adicionar()">Registrar FAFD</button>

<div id="lista"></div>

</div>

<script>

const senhaCorreta="1234";
let modo="ativos";

function entrar(){
if(document.getElementById("senha").value===senhaCorreta){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
carregar();
}else alert("Senha incorreta");
}

function prazoUtil(data){
let d=new Date(data);
let dias=0;
while(dias<3){
d.setDate(d.getDate()+1);
if(d.getDay()!=0 && d.getDay()!=6) dias++;
}
return d.toISOString().split("T")[0];
}

function adicionar(){
if(!nr.value||!nome.value||!data.value){
alert("Preencha Nr, Nome e Data");
return;
}

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

dados.push({
id:Date.now(),
nr:nr.value,
nome:nome.value,
turma:turma.value,
fafPrazo:prazoUtil(data.value),
fase:"fafd",
fiodPrazo:null
});

localStorage.setItem("proc",JSON.stringify(dados));

nr.value="";nome.value="";turma.value="";data.value="";
carregar();
}

function carregar(){
let dados=JSON.parse(localStorage.getItem("proc")||"[]");
let hoje=new Date().toISOString().split("T")[0];
let amanha=new Date();amanha.setDate(amanha.getDate()+1);
let amanhaStr=amanha.toISOString().split("T")[0];

let buscaTexto=document.getElementById("busca").value.toLowerCase();

let lista=document.getElementById("lista");
let dashboard=document.getElementById("dashboard");

lista.innerHTML="";
let cont={v:0,h:0,a:0,p:0,ag:0,f:0,e:0};

dados.forEach(p=>{

if(buscaTexto){
let combinado=(p.nr+" "+p.nome).toLowerCase();
if(!combinado.includes(buscaTexto)) return;
}

if(p.fase==="fafd"){
if(hoje>p.fafPrazo) cont.v++;
else if(p.fafPrazo===hoje) cont.h++;
else if(p.fafPrazo===amanhaStr) cont.a++;
else cont.p++;
}

if(p.fase==="aguardando") cont.ag++;
if(p.fase==="fiod") cont.f++;
if(p.fase==="encerrado") cont.e++;

if(modo==="ativos" && p.fase==="encerrado") return;
if(modo==="historico" && p.fase!=="encerrado") return;

let classe="prazo";

if(p.fase==="fafd"){
if(hoje>p.fafPrazo) classe="vencido";
else if(p.fafPrazo===hoje) classe="venceHoje";
else if(p.fafPrazo===amanhaStr) classe="amanha";
}
if(p.fase==="aguardando") classe="aguardando";
if(p.fase==="fiod") classe="fiod";

lista.innerHTML+=`
<div class="card ${classe}">
<strong>Nr ${p.nr}</strong><br>
${p.nome} - ${p.turma}<br>
${p.fase==="fafd"?`FAFD vence: ${p.fafPrazo}<br>`:""}
${p.fase==="aguardando"?`Status: Aguardando FIOD<br>`:""}
${p.fase==="fiod"?`FIOD vence: ${p.fiodPrazo}<br>`:""}

<br>

${p.fase==="fafd"?`
<button onclick="entregue(${p.id})">Aluno Entregou</button>
<button onclick="revelia(${p.id})">Julgar à Revelia</button>
<button onclick="excluir(${p.id})">Excluir</button>
`:""}

${p.fase==="aguardando"?`
<button onclick="registrarFIOD(${p.id})">Registrar FIOD</button>
`:""}

${p.fase==="fiod"?`
<button onclick="encerrar(${p.id})">Encerrar Processo</button>
`:""}

</div>`;
});

dashboard.innerHTML=`
<div class="box">🔴 Vencidos<br>${cont.v}</div>
<div class="box">🟡 Vence Hoje<br>${cont.h}</div>
<div class="box">🟠 Vence Amanhã<br>${cont.a}</div>
<div class="box">🟢 Em Prazo<br>${cont.p}</div>
<div class="box">🔵 Aguardando FIOD<br>${cont.ag}</div>
<div class="box">🟣 FIOD<br>${cont.f}</div>
<div class="box">⚫ Encerrados<br>${cont.e}</div>
`;
}

function entregue(id){
let dados=JSON.parse(localStorage.getItem("proc"));
dados.find(x=>x.id===id).fase="aguardando";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function revelia(id){
let dados=JSON.parse(localStorage.getItem("proc"));
dados.find(x=>x.id===id).fase="aguardando";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function registrarFIOD(id){
let dados=JSON.parse(localStorage.getItem("proc"));
let p=dados.find(x=>x.id===id);
p.fiodPrazo=prazoUtil(new Date().toISOString().split("T")[0]);
p.fase="fiod";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function encerrar(id){
let dados=JSON.parse(localStorage.getItem("proc"));
dados.find(x=>x.id===id).fase="encerrado";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function excluir(id){
if(!confirm("Excluir registro?")) return;
let dados=JSON.parse(localStorage.getItem("proc"));
dados=dados.filter(p=>p.id!==id);
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function limparBusca(){
document.getElementById("busca").value="";
carregar();
}

function exportarBackup(){
let dados = localStorage.getItem("proc");
if(!dados){alert("Nenhum dado para exportar.");return;}
let blob = new Blob([dados], { type: "application/json" });
let url = URL.createObjectURL(blob);
let a = document.createElement("a");
a.href = url;
a.download = "backup_sistema.json";
a.click();
URL.revokeObjectURL(url);
}

function importarBackup(event){
let arquivo = event.target.files[0];
if(!arquivo) return;
let leitor = new FileReader();
leitor.onload = function(e){
try{
let dadosImportados = JSON.parse(e.target.result);
localStorage.setItem("proc", JSON.stringify(dadosImportados));
alert("Backup restaurado com sucesso!");
carregar();
}catch{
alert("Erro ao importar arquivo.");
}
};
leitor.readAsText(arquivo);
}

</script>
</body>
</html>
