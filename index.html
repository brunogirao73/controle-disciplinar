<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Disciplinar</title>

<link rel="icon" href="brasao.png">
<link rel="apple-touch-icon" href="brasao.png">

<style>
:root{
--verde:#2e3b2f;
--dourado:#c6a052;
--vermelho:#8b0000;
--cinza:#f4f4f4;
}

body{
margin:0;
font-family:Arial;
background:var(--cinza);
}

/* LOGIN */

#login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:var(--verde);
}

.login-box{
background:white;
padding:30px;
width:95%;
max-width:400px;
border-radius:8px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.titulo{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:10px;
}

.titulo img{ width:40px; }

h2{ margin:0; color:var(--verde); }

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:var(--verde);
color:white;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:var(--dourado);
color:black;
}

.alerta{
font-size:12px;
color:var(--vermelho);
font-weight:bold;
margin-top:5px;
}

/* SISTEMA */

#app{
display:none;
padding:15px;
}

.topbar{
background:var(--verde);
color:white;
padding:12px;
border-radius:6px;
text-align:center;
font-weight:bold;
}

.dashboard{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:10px;
}

.box{
flex:1;
min-width:120px;
background:white;
padding:10px;
border-radius:6px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card{
background:white;
padding:10px;
margin-top:10px;
border-radius:6px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="login-box">

<div class="titulo">
<img src="brasao.png">
<h2>CONTROLE DISCIPLINAR</h2>
</div>

<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="entrar()">Entrar</button>

<div class="alerta">
Acesso restrito – uso interno
</div>

</div>
</div>

<!-- SISTEMA -->
<div id="app">

<div class="topbar">Painel Disciplinar</div>

<div class="dashboard" id="dashboard"></div>

<h3>Novo Registro FAFD</h3>

<input id="nr" placeholder="Nr do Aluno">
<input id="nome" placeholder="Nome">
<input id="turma" placeholder="Turma">
<input type="date" id="data">

<button onclick="adicionar()">Registrar</button>

<div id="lista"></div>

</div>

<script>

const senhaCorreta="1234";

function entrar(){
const senhaDigitada=document.getElementById("senha").value;
if(senhaDigitada===senhaCorreta){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
carregar();
}else{
alert("Senha incorreta");
}
}

function prazoUtil(data){
let d=new Date(data);
let dias=0;
while(dias<3){
d.setDate(d.getDate()+1);
if(d.getDay()!=0 && d.getDay()!=6) dias++;
}
return d.toISOString().split("T")[0];
}

function adicionar(){
let nr=document.getElementById("nr").value;
let nome=document.getElementById("nome").value;
let turma=document.getElementById("turma").value;
let data=document.getElementById("data").value;

if(!nr||!nome||!data){
alert("Preencha Nr, Nome e Data");
return;
}

let dados=JSON.parse(localStorage.getItem("processos")||"[]");

let novo={
id:Date.now(),
nr:nr,
nome:nome,
turma:turma,
fafPrazo:prazoUtil(data)
};

dados.push(novo);
localStorage.setItem("processos",JSON.stringify(dados));

document.getElementById("nr").value="";
document.getElementById("nome").value="";
document.getElementById("turma").value="";
document.getElementById("data").value="";

carregar();
}

function carregar(){

let dados=JSON.parse(localStorage.getItem("processos")||"[]");
let hoje=new Date().toISOString().split("T")[0];

let vencidos=0;
let emPrazo=0;

let lista=document.getElementById("lista");
let dashboard=document.getElementById("dashboard");

lista.innerHTML="";

dados.forEach(p=>{
if(hoje>p.fafPrazo) vencidos++;
else emPrazo++;

lista.innerHTML+=`
<div class="card">
<strong>Nr ${p.nr}</strong><br>
${p.nome} - ${p.turma}<br>
Vence: ${p.fafPrazo}
</div>`;
});

dashboard.innerHTML=`
<div class="box">Vencidos<br>${vencidos}</div>
<div class="box">Em Prazo<br>${emPrazo}</div>
`;
}

</script>

</body>
</html>
