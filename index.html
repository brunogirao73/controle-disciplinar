<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Disciplinar</title>

<link rel="icon" href="brasao.png">

<style>

:root{
--verde:#2e3b2f;
--vermelho:#8b0000;
--laranja:#d17a00;
--azul:#004d80;
--roxo:#6a0dad;
--cinza:#f4f4f4;
}

body{
margin:0;
font-family:Arial;
background:var(--cinza);
}

#login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:var(--verde);
}

.login-box{
background:white;
padding:30px;
width:95%;
max-width:400px;
border-radius:8px;
text-align:center;
}

input,button{
width:100%;
padding:8px;
margin:6px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:var(--verde);
color:white;
font-weight:bold;
border:none;
cursor:pointer;
}

#app{
display:none;
padding:15px;
}

.topbar{
background:var(--verde);
color:white;
padding:10px;
border-radius:6px;
text-align:center;
font-weight:bold;
}

.dashboard{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.box{
flex:1;
min-width:120px;
background:white;
padding:8px;
border-radius:6px;
text-align:center;
}

.card{
background:white;
padding:10px;
margin-top:8px;
border-radius:6px;
}

.vencido{border-left:6px solid var(--vermelho);}
.amanha{border-left:6px solid var(--laranja);}
.venceHoje{border-left:6px solid green;background:#e8f5e9;}
.prazo{border-left:6px solid gold;}
.aguardando{border-left:6px solid var(--azul);}
.fiod{border-left:6px solid var(--roxo);}

</style>
</head>
<body>

<div id="login">
<div class="login-box">

<div style="display:flex;align-items:center;justify-content:center;gap:10px;">
<img src="brasao.png" style="width:45px;">
<h2>Controle Disciplinar</h2>
</div>

<input type="password" id="senha" placeholder="Senha">
<button onclick="entrar()">Entrar</button>

<div style="color:#8b0000;font-weight:bold;">
Acesso restrito – uso interno
</div>

</div>
</div>

<div id="app">

<div class="topbar">Painel Disciplinar</div>

<div style="margin-top:10px;">
<button onclick="exportarBackup()">Exportar Backup</button>
<button onclick="document.getElementById('importarArquivo').click()">Importar Backup</button>
<input type="file" id="importarArquivo" style="display:none" accept=".json" onchange="importarBackup(event)">
</div>

<div class="dashboard" id="dashboard"></div>

<div style="margin-top:10px;">
<button onclick="modo='ativos';carregar()">Ver Ativos</button>
<button onclick="modo='historico';carregar()">Ver Histórico</button>
</div>

<div style="display:flex;gap:5px;margin-top:10px;">
<input id="busca" placeholder="Buscar por Nr ou Nome">
<button onclick="buscar()">Buscar</button>
<button onclick="limparBusca()" style="background:#8b0000;">Limpar</button>
</div>

<h3>Novo Registro FAFD</h3>

<input id="nr" placeholder="Nr do Aluno">
<input id="nome" placeholder="Nome">
<input id="turma" placeholder="Turma">
<input type="date" id="data">

<button onclick="adicionar()">Registrar FAFD</button>

<div id="lista"></div>

</div>

<script>

const senhaCorreta="1234";
let modo="ativos";

function entrar(){

if(document.getElementById("senha").value===senhaCorreta){

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

carregar();

}else{
alert("Senha incorreta");
}

}

function prazoUtil(data){

let d=new Date(data);
let dias=0;

while(dias<3){

d.setDate(d.getDate()+1);

if(d.getDay()!=0 && d.getDay()!=6) dias++;

}

return d.toISOString().split("T")[0];

}

function adicionar(){

let nr=document.getElementById("nr").value;
let nome=document.getElementById("nome").value;
let turma=document.getElementById("turma").value;
let data=document.getElementById("data").value;

if(!nr||!nome||!data){

alert("Preencha Nr, Nome e Data");

return;

}

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

dados.push({
id:Date.now(),
nr:nr,
nome:nome,
turma:turma,
fafPrazo:prazoUtil(data),
fase:"fafd",
fiodPrazo:null
});

localStorage.setItem("proc",JSON.stringify(dados));

document.getElementById("nr").value="";
document.getElementById("nome").value="";
document.getElementById("turma").value="";
document.getElementById("data").value="";

carregar();

}

function buscar(){

let texto=document.getElementById("busca").value.toLowerCase();

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

let filtrados=dados.filter(p=>{
let combinado=(p.nr+" "+p.nome).toLowerCase();
return combinado.includes(texto);
});

mostrarLista(filtrados);

}

function limparBusca(){

document.getElementById("busca").value="";
carregar();

}

function carregar(){

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

mostrarLista(dados);

}

function mostrarLista(dados){

let hoje=new Date().toISOString().split("T")[0];

let lista=document.getElementById("lista");
let dashboard=document.getElementById("dashboard");

lista.innerHTML="";

let cont={v:0,h:0,a:0,p:0,ag:0,f:0,e:0};

dados.forEach(p=>{

if(modo==="ativos" && p.fase==="encerrado") return;
if(modo==="historico" && p.fase!=="encerrado") return;

let classe="prazo";

if(p.fase==="fafd"){

if(hoje>p.fafPrazo){classe="vencido";cont.v++;}
else if(p.fafPrazo===hoje){classe="venceHoje";cont.h++;}
else{classe="prazo";cont.p++;}

}

if(p.fase==="aguardando"){classe="aguardando";cont.ag++;}
if(p.fase==="fiod"){classe="fiod";cont.f++;}
if(p.fase==="encerrado"){cont.e++;}

lista.innerHTML+=`

<div class="card ${classe}">

<strong>Nr ${p.nr}</strong><br>
${p.nome} - ${p.turma}<br>

${p.fase==="fafd"?`FAFD vence: ${p.fafPrazo}<br>`:""}
${p.fase==="aguardando"?`Aguardando FIOD<br>`:""}
${p.fase==="fiod"?`FIOD vence: ${p.fiodPrazo}<br>`:""}

<br>

${p.fase==="fafd"?`
<button onclick="entregue(${p.id})">Aluno Entregou</button>
<button onclick="revelia(${p.id})">Revelia</button>
<button onclick="excluir(${p.id})">Excluir</button>
`:""}

${p.fase==="aguardando"?`
<button onclick="registrarFIOD(${p.id})">Registrar FIOD</button>
`:""}

${p.fase==="fiod"?`
<button onclick="encerrar(${p.id})">Encerrar</button>
`:""}

</div>

`;

});

dashboard.innerHTML=`

<div class="box">Vencidos<br>${cont.v}</div>
<div class="box">Vence Hoje<br>${cont.h}</div>
<div class="box">Em Prazo<br>${cont.p}</div>
<div class="box">Aguardando FIOD<br>${cont.ag}</div>
<div class="box">FIOD<br>${cont.f}</div>
<div class="box">Encerrados<br>${cont.e}</div>

`;

}

function entregue(id){
let dados=JSON.parse(localStorage.getItem("proc"));
dados.find(x=>x.id===id).fase="aguardando";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function revelia(id){
let dados=JSON.parse(localStorage.getItem("proc"));
dados.find(x=>x.id===id).fase="aguardando";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function registrarFIOD(id){
let dados=JSON.parse(localStorage.getItem("proc"));
let p=dados.find(x=>x.id===id);
p.fiodPrazo=prazoUtil(new Date().toISOString().split("T")[0]);
p.fase="fiod";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function encerrar(id){
let dados=JSON.parse(localStorage.getItem("proc"));
dados.find(x=>x.id===id).fase="encerrado";
localStorage.setItem("proc",JSON.stringify(dados));
carregar();
}

function excluir(id){

if(!confirm("Excluir registro?")) return;

let dados=JSON.parse(localStorage.getItem("proc"));

dados=dados.filter(p=>p.id!==id);

localStorage.setItem("proc",JSON.stringify(dados));

carregar();

}

function exportarBackup(){

let dados=localStorage.getItem("proc");

let blob=new Blob([dados],{type:"application/json"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;
a.download="backup_sistema.json";
a.click();

}

function importarBackup(event){

let arquivo=event.target.files[0];

let leitor=new FileReader();

leitor.onload=function(e){

let dadosImportados=JSON.parse(e.target.result);

localStorage.setItem("proc",JSON.stringify(dadosImportados));

carregar();

};

leitor.readAsText(arquivo);

}

</script>

</body>
</html>
