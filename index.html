<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Disciplinar - CMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family:Arial; margin:0; background:#f4f6f5; }

.hidden { display:none; }

.top { padding:15px; background:#1b3a2b; color:white; text-align:center; }

.container { padding:15px; }

input, textarea, button {
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button { background:#1b3a2b; color:white; border:none; }

.card {
    background:white;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.vencido { border-left:5px solid red; }
.pendente { border-left:5px solid orange; }

.small { font-size:13px; color:#555; }
</style>
</head>

<body>

<div class="top">Sistema Disciplinar</div>

<div class="container">

<input type="text" id="nome" placeholder="Nome do Aluno">
<input type="text" id="turma" placeholder="Turma">
<input type="date" id="dataFafd">
<textarea id="obs" placeholder="Observações"></textarea>
<button onclick="adicionar()">Registrar FAFD</button>

<hr>

<button onclick="toggleHistorico()">Ver Histórico</button>
<button onclick="limparHistorico()">Limpar Histórico</button>

<div id="lista"></div>

</div>

<script>

let mostrarHistorico=false;

function calcularPrazo(data){
    let d=new Date(data);
    let dias=0;
    while(dias<3){
        d.setDate(d.getDate()+1);
        if(d.getDay()!=0 && d.getDay()!=6) dias++;
    }
    return d.toISOString().split("T")[0];
}

function adicionar(){
    let nome=document.getElementById("nome").value;
    let turma=document.getElementById("turma").value;
    let data=document.getElementById("dataFafd").value;
    let obs=document.getElementById("obs").value;

    if(!nome||!data){ alert("Preencha nome e data"); return; }

    let processo={
        id: Date.now(), // ID ÚNICO
        nome,
        turma,
        obs,
        fafdPrazo:calcularPrazo(data),
        fiodPrazo:null,
        resultado:null,
        encerrado:false
    };

    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    dados.push(processo);
    localStorage.setItem("processos",JSON.stringify(dados));

    carregar();
}

function carregar(){
    let lista=document.getElementById("lista");
    lista.innerHTML="";
    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    let hoje=new Date().toISOString().split("T")[0];

    dados.sort((a,b)=>{
        let prazoA=a.fiodPrazo||a.fafdPrazo;
        let prazoB=b.fiodPrazo||b.fafdPrazo;
        return new Date(prazoA)-new Date(prazoB);
    });

    dados.forEach(p=>{

        if(!mostrarHistorico && p.encerrado) return;
        if(mostrarHistorico && !p.encerrado) return;

        let prazoAtual=p.fiodPrazo||p.fafdPrazo;

        let classe = hoje>prazoAtual ? "vencido":"pendente";

        lista.innerHTML+=`
        <div class="card ${classe}">
        <strong>${p.nome}</strong> - ${p.turma}<br>
        FAFD vence: ${p.fafdPrazo}<br>
        ${p.fiodPrazo ? "FIOD vence: "+p.fiodPrazo+"<br>Resultado: "+p.resultado+"<br>" : ""}
        <div class="small">${p.obs||""}</div><br>

        ${!p.fiodPrazo && !p.encerrado ?
        `<button onclick="registrarFIOD(${p.id})">Registrar FIOD</button>` : ""}

        ${p.fiodPrazo && !p.encerrado ?
        `<button onclick="encerrar(${p.id})">Encerrar Processo</button>` : ""}
        </div>`;
    });
}

function registrarFIOD(id){
    let dados=JSON.parse(localStorage.getItem("processos"));
    let processo=dados.find(p=>p.id===id);

    let escolha=prompt("1 - Entregue no prazo\n2 - À revelia");

    if(escolha!=="1" && escolha!=="2"){ return; }

    let hoje=new Date().toISOString().split("T")[0];

    processo.fiodPrazo=calcularPrazo(hoje);
    processo.resultado=(escolha==="1")?"Entregue no prazo":"À revelia";

    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function encerrar(id){
    let dados=JSON.parse(localStorage.getItem("processos"));
    let processo=dados.find(p=>p.id===id);
    processo.encerrado=true;
    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function toggleHistorico(){
    mostrarHistorico=!mostrarHistorico;
    carregar();
}

function limparHistorico(){
    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    dados=dados.filter(p=>!p.encerrado);
    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

carregar();

</script>

</body>
</html>
