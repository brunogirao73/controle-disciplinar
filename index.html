<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Controle Disciplinar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin:0;
    background:#f4f6f9;
}

.login-container {
    text-align:center;
}

.banner {
    position:relative;
    height:220px;
    background:url('https://upload.wikimedia.org/wikipedia/commons/7/75/Col%C3%A9gio_Militar_de_Curitiba.jpg') center/cover no-repeat;
}

.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
}

.banner-text {
    position:absolute;
    bottom:15px;
    left:0;
    right:0;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.login-box {
    padding:20px;
}

input, button {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

button {
    background:#1f3a63;
    color:white;
    border:none;
}

.link-manual {
    margin-top:10px;
    display:block;
    font-size:14px;
    color:#1f3a63;
    text-decoration:none;
}

.link-manual:hover {
    text-decoration:underline;
}

.hidden { display:none; }

/* restante do sistema */

.top-bar {
    background:white;
    padding:12px;
    border-radius:10px;
    margin:15px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.card {
    background:white;
    padding:14px;
    margin:12px 15px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.05);
}

.badge {
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

.vencido { background:#e74c3c; color:white; }
.pendente { background:#f39c12; color:white; }

.small { font-size:13px; color:#555; }

</style>
</head>

<body>

<div id="login" class="login-container">

<div class="banner">
    <div class="overlay"></div>
    <div class="banner-text">Controle Disciplinar CMC</div>
</div>

<div class="login-box">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>

    <a class="link-manual"
       href="https://www.cmc.eb.mil.br/images/2026/Manual%20Aluno%202026/Manual%20do%20Aluno%20SCMB.pdf"
       target="_blank">
       📘 Acessar Manual do Aluno
    </a>
</div>

</div>

<div id="app" class="hidden">

<h2 style="text-align:center;">Controle Disciplinar</h2>

<div class="top-bar">
<strong id="contador"></strong>
<input type="text" id="pesquisa" placeholder="Pesquisar aluno..." onkeyup="carregar()">
<button onclick="toggleHistorico()">Ver Histórico</button>
<button onclick="exportar()">Backup</button>
</div>

<input type="text" id="nome" placeholder="Nome do Aluno">
<input type="text" id="turma" placeholder="Turma">
<input type="date" id="dataFafd">
<textarea id="obs" placeholder="Observações"></textarea>
<button onclick="adicionar()">Registrar FAFD</button>

<div id="lista"></div>

</div>

<script>

let SENHA = localStorage.getItem("senhaApp") || "1234";
let mostrarHistorico=false;

function entrar(){
    if(document.getElementById("senha").value===SENHA){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        carregar();
    } else alert("Senha incorreta");
}

function calcularPrazo(data){
    let d=new Date(data);
    let dias=0;
    while(dias<3){
        d.setDate(d.getDate()+1);
        let dia=d.getDay();
        if(dia!==0 && dia!==6) dias++;
    }
    return d.toISOString().split("T")[0];
}

function adicionar(){
    let nome=document.getElementById("nome").value;
    let turma=document.getElementById("turma").value;
    let data=document.getElementById("dataFafd").value;
    let obs=document.getElementById("obs").value;

    if(!nome||!data) return alert("Preencha nome e data");

    let processo={
        nome,
        turma,
        obs,
        fafdData:data,
        fafdPrazo:calcularPrazo(data),
        fiodPrazo:null,
        encerrado:false
    };

    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    dados.push(processo);
    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function carregar(){
    let lista=document.getElementById("lista");
    lista.innerHTML="";
    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    let hoje=new Date().toISOString().split("T")[0];
    let pesquisa=document.getElementById("pesquisa").value.toLowerCase();

    let ativos=0;
    let vencidos=0;

    dados.forEach((p,index)=>{

        if(p.nome.toLowerCase().indexOf(pesquisa)===-1) return;
        if(!mostrarHistorico && p.encerrado) return;
        if(mostrarHistorico && !p.encerrado) return;

        let prazo=p.fiodPrazo || p.fafdPrazo;
        let badge="";

        if(!p.encerrado){
            ativos++;
            if(hoje>prazo){
                vencidos++;
                badge=`<span class="badge vencido">VENCIDO</span>`;
            } else{
                badge=`<span class="badge pendente">EM PRAZO</span>`;
            }
        }

        lista.innerHTML+=`
        <div class="card">
        <strong>${p.nome}</strong> - ${p.turma}<br>
        FAFD vence: ${p.fafdPrazo}<br>
        ${badge}<br>
        <div class="small">${p.obs||""}</div><br>
        ${!p.fiodPrazo && !p.encerrado ? `<button onclick="registrarFIOD(${index})">Registrar FIOD</button>`:""}
        </div>`;
    });

    document.getElementById("contador").innerText=
    mostrarHistorico ? "📁 Histórico" :
    `🔄 Ativos: ${ativos} | 🔴 Vencidos: ${vencidos}`;
}

function registrarFIOD(index){
    if(!confirm("Registrar FIOD?")) return;
    let dados=JSON.parse(localStorage.getItem("processos"));
    let hoje=new Date().toISOString().split("T")[0];
    dados[index].fiodPrazo=calcularPrazo(hoje);
    dados[index].encerrado=true;
    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function toggleHistorico(){
    mostrarHistorico=!mostrarHistorico;
    carregar();
}

function exportar(){
    let dados=localStorage.getItem("processos")||"[]";
    let blob=new Blob([dados],{type:"application/json"});
    let url=URL.createObjectURL(blob);
    let a=document.createElement("a");
    a.href=url;
    a.download="backup_controle_disciplinar.json";
    a.click();
}

</script>

</body>
</html>
