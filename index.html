<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Disciplinar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="brasao.png">
<link rel="apple-touch-icon" href="brasao.png">

<style>
body { margin:0; font-family:Arial; background:#f4f6f5; }

.hidden { display:none; }

.banner {
    background:url('banner.jpg') center/cover no-repeat;
    height:220px;
    position:relative;
}

.overlay {
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

.banner-text {
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
}

.banner-text img { width:70px; margin-bottom:8px; }

.login-box { padding:20px; text-align:center; }

input, textarea, button {
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button { background:#1b3a2b; color:white; border:none; }

.topbar {
    background:#1b3a2b;
    color:white;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.container { padding:15px; }

.card {
    background:white;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.vencido { border-left:5px solid red; }
.pendente { border-left:5px solid orange; }

.historico-bg {
    background:#e9ecef;
}

.indicador {
    text-align:center;
    font-weight:bold;
    margin:10px 0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">

<div class="banner">
<div class="overlay"></div>
<div class="banner-text">
<img src="brasao.png">
<h2>SISTEMA DISCIPLINAR</h2>
Colégio Militar
</div>
</div>

<div class="login-box">
<input type="password" id="senha" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
</div>

</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="topbar" id="titulo">PROCESSOS ATIVOS</div>

<div class="container">

<div id="indicador" class="indicador"></div>

<button onclick="mostrarAtivos()">Ver Ativos</button>
<button onclick="mostrarHistorico()">Ver Histórico</button>
<button onclick="limparHistorico()">Limpar Histórico</button>

<hr>

<h3>Novo Registro</h3>

<input type="text" id="nome" placeholder="Nome do Aluno">
<input type="text" id="turma" placeholder="Turma">
<input type="date" id="dataFafd">
<textarea id="obs" placeholder="Observações"></textarea>
<button onclick="adicionar()">Registrar FAFD</button>

<hr>

<div id="lista"></div>

</div>
</div>

<script>

let modo="ativos";
let SENHA="1234";

function entrar(){
    if(document.getElementById("senha").value===SENHA){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        carregar();
    } else alert("Senha incorreta");
}

function calcularPrazo(data){
    let d=new Date(data);
    let dias=0;
    while(dias<3){
        d.setDate(d.getDate()+1);
        if(d.getDay()!=0 && d.getDay()!=6) dias++;
    }
    return d.toISOString().split("T")[0];
}

function adicionar(){
    let nome=document.getElementById("nome").value;
    let turma=document.getElementById("turma").value;
    let data=document.getElementById("dataFafd").value;
    let obs=document.getElementById("obs").value;

    if(!nome||!data){ alert("Preencha nome e data"); return; }

    let processo={
        id:Date.now(),
        nome,
        turma,
        obs,
        fafdPrazo:calcularPrazo(data),
        fiodPrazo:null,
        resultado:null,
        encerrado:false
    };

    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    dados.push(processo);
    localStorage.setItem("processos",JSON.stringify(dados));

    carregar();
}

function carregar(){

    let lista=document.getElementById("lista");
    lista.innerHTML="";
    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    let hoje=new Date().toISOString().split("T")[0];

    dados.sort((a,b)=>{
        let prazoA=a.fiodPrazo||a.fafdPrazo;
        let prazoB=b.fiodPrazo||b.fafdPrazo;
        return new Date(prazoA)-new Date(prazoB);
    });

    dados.forEach(p=>{

        if(modo==="ativos" && p.encerrado) return;
        if(modo==="historico" && !p.encerrado) return;

        let prazoAtual=p.fiodPrazo||p.fafdPrazo;
        let classe=hoje>prazoAtual?"vencido":"pendente";

        lista.innerHTML+=`
        <div class="card ${classe}">
        <strong>${p.nome}</strong> - ${p.turma}<br>
        FAFD vence: ${p.fafdPrazo}<br>
        ${p.fiodPrazo?"FIOD vence: "+p.fiodPrazo+"<br>Resultado: "+p.resultado+"<br>":""}
        ${p.obs||""}<br><br>

        ${!p.fiodPrazo && !p.encerrado?
        `<button onclick="registrarFIOD(${p.id})">Registrar FIOD</button>`:""}

        ${p.fiodPrazo && !p.encerrado?
        `<button onclick="encerrar(${p.id})">Encerrar Processo</button>`:""}
        </div>`;
    });

    document.getElementById("titulo").innerText=
        modo==="ativos"?"PROCESSOS ATIVOS":"HISTÓRICO ENCERRADOS";

    document.getElementById("indicador").innerText=
        modo==="ativos"?"Você está visualizando PROCESSOS ATIVOS":
        "Você está no HISTÓRICO (somente leitura)";
}

function registrarFIOD(id){
    let dados=JSON.parse(localStorage.getItem("processos"));
    let processo=dados.find(p=>p.id===id);

    let escolha=prompt("1 - Entregue no prazo\n2 - À revelia");
    if(escolha!=="1"&&escolha!=="2") return;

    let hoje=new Date().toISOString().split("T")[0];

    processo.fiodPrazo=calcularPrazo(hoje);
    processo.resultado=(escolha==="1")?"Entregue no prazo":"À revelia";

    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function encerrar(id){
    let dados=JSON.parse(localStorage.getItem("processos"));
    let processo=dados.find(p=>p.id===id);
    processo.encerrado=true;
    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function mostrarHistorico(){
    modo="historico";
    carregar();
}

function mostrarAtivos(){
    modo="ativos";
    carregar();
}

function limparHistorico(){
    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    dados=dados.filter(p=>!p.encerrado);
    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

</script>

</body>
</html>
