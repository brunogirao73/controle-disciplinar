<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Disciplinar</title>

<link rel="icon" href="brasao.png">
<link rel="apple-touch-icon" href="brasao.png">

<style>

:root{
--verde:#2e3b2f;
--vermelho:#8b0000;
--laranja:#d17a00;
--azul:#004d80;
--roxo:#6a0dad;
--cinza:#f4f4f4;
}

body{
margin:0;
font-family:Arial;
background:var(--cinza);
}

/* LOGIN */

#login{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:var(--verde);
}

.login-box{
background:white;
padding:30px;
width:95%;
max-width:400px;
border-radius:8px;
text-align:center;
}

input,button{
width:100%;
padding:8px;
margin:6px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:var(--verde);
color:white;
font-weight:bold;
border:none;
cursor:pointer;
}

/* APP */

#app{
display:none;
padding:15px;
}

.topbar{
background:var(--verde);
color:white;
padding:10px;
border-radius:6px;
text-align:center;
font-weight:bold;
}

.dashboard{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:10px;
}

.box{
flex:1;
min-width:110px;
background:white;
padding:10px;
border-radius:6px;
text-align:center;
font-size:13px;
font-weight:bold;
}

.vencido{border-left:8px solid red;}
.venceHoje{border-left:8px solid orange;}
.prazo{border-left:8px solid green;}
.aguardando{border-left:8px solid blue;}
.fiod{border-left:8px solid purple;}

.card{
background:white;
padding:10px;
margin-top:8px;
border-radius:6px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

<div class="login-box">

<div style="display:flex;align-items:center;justify-content:center;gap:10px;">
<img src="brasao.png" style="width:45px;">
<h2>Controle Disciplinar</h2>
</div>

<input type="password" id="senha" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

<div style="color:#8b0000;font-weight:bold;">
Acesso restrito – uso interno
</div>

</div>

</div>

<!-- APP -->

<div id="app">

<div class="topbar">Painel Disciplinar</div>

<div style="margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;">
<button onclick="exportarBackup()">💾 Exportar Backup</button>
<button onclick="document.getElementById('importarArquivo').click()">📂 Importar Backup</button>
<input type="file" id="importarArquivo" style="display:none" accept=".json" onchange="importarBackup(event)">
</div>

<div class="dashboard" id="dashboard"></div>

<div style="margin-top:10px;">
<button onclick="modo='ativos';carregar()">Ativos</button>
<button onclick="modo='historico';carregar()">Histórico</button>
</div>

<div style="display:flex;gap:5px;margin-top:10px;">
<input id="busca" placeholder="Buscar aluno">
<button onclick="buscar()">🔎 Buscar</button>
<button onclick="limparBusca()" style="background:#8b0000;">Limpar</button>
</div>

<h3>Novo Registro FAFD</h3>

<input id="nr" placeholder="Nr do aluno">
<input id="nome" placeholder="Nome">
<input id="turma" placeholder="Turma">
<input type="date" id="data">

<button onclick="registrarFAFD()">Registrar FAFD</button>

<div id="lista"></div>

</div>

<script>

const senhaCorreta="1234";
let modo="ativos";

function entrar(){

if(document.getElementById("senha").value===senhaCorreta){

login.style.display="none";
app.style.display="block";

carregar();

}else{
alert("Senha incorreta");
}

}

function prazoUtil(data){

let d=new Date(data);
let dias=0;

while(dias<3){

d.setDate(d.getDate()+1);

if(d.getDay()!=0 && d.getDay()!=6) dias++;

}

return d.toISOString().split("T")[0];

}

function registrarFAFD(){

let nr=document.getElementById("nr").value;
let nome=document.getElementById("nome").value;
let turma=document.getElementById("turma").value;
let data=document.getElementById("data").value;

if(!nr||!nome||!data){

alert("Preencha os campos obrigatórios");

return;

}

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

dados.push({

id:Date.now(),
nr:nr,
nome:nome,
turma:turma,
fafPrazo:prazoUtil(data),
fase:"fafd",
fiodPrazo:null

});

localStorage.setItem("proc",JSON.stringify(dados));

nr.value="";
nome.value="";
turma.value="";
data.value="";

carregar();

}

function carregar(){

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

mostrarLista(dados);

}

function buscar(){

let texto=document.getElementById("busca").value.toLowerCase();

let dados=JSON.parse(localStorage.getItem("proc")||"[]");

let filtrados=dados.filter(p=>{

let t=(p.nr+" "+p.nome).toLowerCase();

return t.includes(texto);

});

mostrarLista(filtrados);

}

function limparBusca(){

busca.value="";

carregar();

}

function mostrarLista(dados){

let hoje=new Date().toISOString().split("T")[0];

let lista=document.getElementById("lista");

let dashboard=document.getElementById("dashboard");

lista.innerHTML="";

let v=0,h=0,p=0,a=0,f=0,e=0;

dados.forEach(pessoa=>{

if(modo==="ativos" && pessoa.fase==="encerrado") return;

if(modo==="historico" && pessoa.fase!=="encerrado") return;

let classe="prazo";

if(pessoa.fase==="fafd"){

if(hoje>pessoa.fafPrazo){classe="vencido";v++;}

else if(hoje===pessoa.fafPrazo){classe="venceHoje";h++;}

else{classe="prazo";p++;}

}

if(pessoa.fase==="aguardando"){classe="aguardando";a++;}

if(pessoa.fase==="fiod"){classe="fiod";f++;}

if(pessoa.fase==="encerrado"){e++;}

lista.innerHTML+=`

<div class="card ${classe}">

<strong>Nr ${pessoa.nr}</strong><br>

${pessoa.nome} - ${pessoa.turma}<br>

${pessoa.fase==="fafd"?`FAFD vence: ${pessoa.fafPrazo}<br>`:""}

${pessoa.fase==="aguardando"?`Aguardando FIOD<br>`:""}

${pessoa.fase==="fiod"?`FIOD vence: ${pessoa.fiodPrazo}<br>`:""}

<br>

${pessoa.fase==="fafd"?`

<button onclick="entregue(${pessoa.id})">Aluno entregou</button>

<button onclick="revelia(${pessoa.id})">Revelia</button>

<button onclick="excluir(${pessoa.id})">Excluir</button>

`:""}

${pessoa.fase==="aguardando"?`

<button onclick="registrarFIOD(${pessoa.id})">Registrar FIOD</button>

`:""}

${pessoa.fase==="fiod"?`

<button onclick="encerrar(${pessoa.id})">Encerrar</button>

`:""}

</div>

`;

});

dashboard.innerHTML=`

<div class="box vencido">🔴 Vencidos<br>${v}</div>

<div class="box venceHoje">🟡 Vence Hoje<br>${h}</div>

<div class="box prazo">🟢 Em Prazo<br>${p}</div>

<div class="box aguardando">🔵 Aguardando<br>${a}</div>

<div class="box fiod">🟣 FIOD<br>${f}</div>

<div class="box">⚫ Encerrados<br>${e}</div>

`;

}

function entregue(id){

let dados=JSON.parse(localStorage.getItem("proc"));

dados.find(x=>x.id===id).fase="aguardando";

localStorage.setItem("proc",JSON.stringify(dados));

carregar();

}

function revelia(id){

let dados=JSON.parse(localStorage.getItem("proc"));

dados.find(x=>x.id===id).fase="aguardando";

localStorage.setItem("proc",JSON.stringify(dados));

carregar();

}

function registrarFIOD(id){

let dados=JSON.parse(localStorage.getItem("proc"));

let p=dados.find(x=>x.id===id);

p.fiodPrazo=prazoUtil(new Date().toISOString().split("T")[0]);

p.fase="fiod";

localStorage.setItem("proc",JSON.stringify(dados));

carregar();

}

function encerrar(id){

let dados=JSON.parse(localStorage.getItem("proc"));

dados.find(x=>x.id===id).fase="encerrado";

localStorage.setItem("proc",JSON.stringify(dados));

carregar();

}

function excluir(id){

if(!confirm("Excluir registro?")) return;

let dados=JSON.parse(localStorage.getItem("proc"));

dados=dados.filter(p=>p.id!==id);

localStorage.setItem("proc",JSON.stringify(dados));

carregar();

}

function exportarBackup(){

let dados=localStorage.getItem("proc");

let blob=new Blob([dados],{type:"application/json"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="backup_sistema.json";

a.click();

}

function importarBackup(event){

let arquivo=event.target.files[0];

let leitor=new FileReader();

leitor.onload=function(e){

let dadosImportados=JSON.parse(e.target.result);

localStorage.setItem("proc",JSON.stringify(dadosImportados));

carregar();

};

leitor.readAsText(arquivo);

}

</script>

</body>
</html>
