<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Disciplinar - CMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="brasao.png">
<link rel="apple-touch-icon" href="brasao.png">

<style>
:root {
    --verde-eb:#1b3a2b;
    --verde-sec:#2e5d3b;
    --dourado:#c6a437;
    --fundo:#f4f6f5;
}

body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--fundo);
    color:#1b2e1b;
}

.banner {
    background:url('banner.jpg') center/cover no-repeat;
    height:230px;
    position:relative;
}

.overlay {
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

.banner-content {
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    color:white;
}

.banner-content img {
    width:70px;
    margin-bottom:8px;
}

.login-box {
    padding:25px;
    text-align:center;
}

input, textarea, button {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

button {
    background:var(--verde-eb);
    color:white;
    border:none;
}

button:hover { background:var(--verde-sec); }

.hidden { display:none; }

h2 {
    text-align:center;
    color:var(--verde-eb);
    margin-top:20px;
}

.top-bar {
    background:white;
    margin:15px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.card {
    background:white;
    margin:15px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

.badge {
    display:inline-block;
    padding:5px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
}

.vencido { background:#b22222; color:white; }
.pendente { background:var(--dourado); color:white; }

footer {
    text-align:center;
    padding:20px;
    font-size:13px;
    color:#555;
    margin-top:30px;
    border-top:1px solid #ddd;
}
</style>
</head>

<body>

<div id="login">
<div class="banner">
    <div class="overlay"></div>
    <div class="banner-content">
        <img src="brasao.png">
        <h1>SISTEMA DISCIPLINAR</h1>
        <div>Colégio Militar</div>
    </div>
</div>

<div class="login-box">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="entrar()">Acessar Sistema</button>
</div>
</div>

<div id="app" class="hidden">

<h2>Controle Disciplinar</h2>

<div class="top-bar">
<strong id="contador"></strong>
<input type="text" id="pesquisa" placeholder="Pesquisar aluno..." onkeyup="carregar()">
<button onclick="toggleHistorico()">Histórico</button>
</div>

<input type="text" id="nome" placeholder="Nome do Aluno">
<input type="text" id="turma" placeholder="Turma">
<input type="date" id="dataFafd">
<textarea id="obs" placeholder="Observações"></textarea>
<button onclick="adicionar()">Registrar FAFD</button>

<div id="lista"></div>

<footer>
Colégio Militar • Sistema Interno Disciplinar • <span id="ano"></span>
</footer>

</div>

<script>

document.getElementById("ano").innerText=new Date().getFullYear();

let SENHA="1234";
let mostrarHistorico=false;

function entrar(){
    if(document.getElementById("senha").value===SENHA){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        carregar();
    } else alert("Senha incorreta");
}

function calcularPrazo(data){
    let d=new Date(data);
    let dias=0;
    while(dias<3){
        d.setDate(d.getDate()+1);
        let dia=d.getDay();
        if(dia!==0 && dia!==6) dias++;
    }
    return d.toISOString().split("T")[0];
}

function adicionar(){
    let nome=document.getElementById("nome").value;
    let turma=document.getElementById("turma").value;
    let data=document.getElementById("dataFafd").value;
    let obs=document.getElementById("obs").value;

    if(!nome||!data){
        alert("Preencha nome e data");
        return;
    }

    let processo={
        nome:nome,
        turma:turma,
        obs:obs,
        fafdPrazo:calcularPrazo(data),
        fiodData:null,
        fiodPrazo:null,
        resultado:null,
        encerrado:false
    };

    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    dados.push(processo);
    localStorage.setItem("processos",JSON.stringify(dados));

    document.getElementById("nome").value="";
    document.getElementById("turma").value="";
    document.getElementById("dataFafd").value="";
    document.getElementById("obs").value="";

    carregar();
}

function carregar(){
    let lista=document.getElementById("lista");
    lista.innerHTML="";
    let dados=JSON.parse(localStorage.getItem("processos")||"[]");
    let hoje=new Date().toISOString().split("T")[0];
    let pesquisa=document.getElementById("pesquisa").value.toLowerCase();

    dados.sort((a,b)=>new Date(a.fafdPrazo)-new Date(b.fafdPrazo));

    let ativos=0;
    let vencidos=0;

    dados.forEach((p,index)=>{

        if(p.nome.toLowerCase().indexOf(pesquisa)===-1) return;
        if(!mostrarHistorico && p.encerrado) return;
        if(mostrarHistorico && !p.encerrado) return;

        let badge="";
        if(!p.encerrado){
            ativos++;
            if(hoje>p.fafdPrazo){
                vencidos++;
                badge=`<span class="badge vencido">VENCIDO</span>`;
            } else{
                badge=`<span class="badge pendente">EM PRAZO</span>`;
            }
        }

        lista.innerHTML+=`
        <div class="card">
        <strong>${p.nome}</strong> - ${p.turma}<br>
        FAFD vence: ${p.fafdPrazo}<br>
        ${p.fiodData ? "FIOD registrada em: "+p.fiodData+"<br>Resultado: "+p.resultado+"<br>" : ""}
        ${badge}<br>
        ${p.obs||""}<br><br>
        ${!p.encerrado && !p.fiodData ? `<button onclick="registrarFIOD(${index})">Registrar FIOD</button>`:""}
        </div>`;
    });

    document.getElementById("contador").innerText=
    mostrarHistorico?"📁 Histórico":
    `Ativos: ${ativos} | Vencidos: ${vencidos}`;
}

function registrarFIOD(index){

    let dados=JSON.parse(localStorage.getItem("processos"));
    let escolha=prompt("Resultado:\n1 - Entregue no prazo\n2 - À revelia");

    if(escolha!=="1" && escolha!=="2"){
        alert("Operação cancelada ou inválida.");
        return;
    }

    let hoje=new Date().toISOString().split("T")[0];

    dados[index].fiodData=hoje;
    dados[index].fiodPrazo=calcularPrazo(hoje);
    dados[index].resultado=(escolha==="1")?"Entregue no prazo":"À revelia";
    dados[index].encerrado=true;

    localStorage.setItem("processos",JSON.stringify(dados));
    carregar();
}

function toggleHistorico(){
    mostrarHistorico=!mostrarHistorico;
    carregar();
}

</script>

</body>
</html>
