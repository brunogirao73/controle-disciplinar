<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Disciplinar 2.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6f5; }

.hidden { display:none; }

.banner {
    background:url('banner.jpg') center/cover no-repeat;
    height:220px;
    position:relative;
}

.overlay {
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.banner-text {
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
}

.banner-text img { width:70px; margin-bottom:8px; }

.login-box { padding:20px; text-align:center; }

input, textarea, button {
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button { background:#1b3a2b; color:white; border:none; }

.topbar {
    background:#1b3a2b;
    color:white;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.dashboard {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
}

.box {
    flex:1;
    min-width:120px;
    background:white;
    padding:10px;
    border-radius:8px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.container { padding:15px; }

.card {
    background:white;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.vencido { border-left:6px solid red; }
.amanha { border-left:6px solid orange; }
.prazo { border-left:6px solid gold; }
</style>
</head>

<body>

<div id="login">
<div class="banner">
<div class="overlay"></div>
<div class="banner-text">
<img src="brasao.png">
<h2>SISTEMA DISCIPLINAR</h2>
Colégio Militar
</div>
</div>

<div class="login-box">
<input type="password" id="senha" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
</div>
</div>

<div id="app" class="hidden">

<div class="topbar">Painel Disciplinar</div>

<div class="dashboard" id="dashboard"></div>

<div class="container">

<h3>Novo Registro FAFD</h3>

<input type="text" id="nr" placeholder="Nr do Aluno">
<input type="text" id="nome" placeholder="Nome do Aluno">
<input type="text" id="turma" placeholder="Turma">
<input type="date" id="dataFafd">
<textarea id="obs" placeholder="Observações"></textarea>
<button onclick="adicionar()">Registrar FAFD</button>

<hr>

<button onclick="toggleHistorico()">Alternar Histórico</button>

<div id="lista"></div>

</div>
</div>

<script>

let SENHA="1234";
let modo="ativos";

function entrar(){
if(document.getElementById("senha").value===SENHA){
document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
carregar();
}else alert("Senha incorreta");
}

function calcularPrazo(data){
let d=new Date(data);
let dias=0;
while(dias<3){
d.setDate(d.getDate()+1);
if(d.getDay()!=0 && d.getDay()!=6) dias++;
}
return d.toISOString().split("T")[0];
}

function adicionar(){
let nr=document.getElementById("nr").value;
let nome=document.getElementById("nome").value;
let turma=document.getElementById("turma").value;
let data=document.getElementById("dataFafd").value;
let obs=document.getElementById("obs").value;

if(!nr||!nome||!data){ alert("Preencha Nr, Nome e Data"); return; }

let processo={
id:Date.now(),
nr,
nome,
turma,
obs,
fafPrazo:calcularPrazo(data),
fase:"fafd",
fiodPrazo:null
};

let dados=JSON.parse(localStorage.getItem("processos")||"[]");
dados.push(processo);
localStorage.setItem("processos",JSON.stringify(dados));
carregar();
}

function carregar(){

let lista=document.getElementById("lista");
let dash=document.getElementById("dashboard");
lista.innerHTML="";
dash.innerHTML="";

let dados=JSON.parse(localStorage.getItem("processos")||"[]");
let hoje=new Date();
let amanha=new Date();
amanha.setDate(hoje.getDate()+1);

let hojeStr=hoje.toISOString().split("T")[0];
let amanhaStr=amanha.toISOString().split("T")[0];

let cont={vencido:0,prazo:0,amanha:0,aguardando:0,fiod:0,encerrado:0};

dados.forEach(p=>{

if(p.fase==="fafd"){
if(hojeStr>p.fafPrazo) cont.vencido++;
else if(p.fafPrazo===amanhaStr) cont.amanha++;
else cont.prazo++;
}

if(p.fase==="entregue"||p.fase==="revelia") cont.aguardando++;
if(p.fase==="fiod") cont.fiod++;
if(p.fase==="encerrado") cont.encerrado++;

if(modo==="ativos" && p.fase==="encerrado") return;
if(modo==="historico" && p.fase!=="encerrado") return;

let classe="prazo";
if(p.fase==="fafd"){
if(hojeStr>p.fafPrazo) classe="vencido";
else if(p.fafPrazo===amanhaStr) classe="amanha";
}

lista.innerHTML+=`
<div class="card ${classe}">
<strong>Nr ${p.nr}</strong><br>
${p.nome} - ${p.turma}<br>
FAFD vence: ${p.fafPrazo}<br>
${p.fiodPrazo?"FIOD vence: "+p.fiodPrazo+"<br>":""}
<br>

${p.fase==="fafd"?`
<button onclick="entregue(${p.id})">Aluno Entregou</button>
<button onclick="revelia(${p.id})">Julgar à Revelia</button>
<button onclick="excluir(${p.id})">Excluir</button>
`:""}

${(p.fase==="entregue"||p.fase==="revelia")?`
<button onclick="registrarFIOD(${p.id})">Registrar FIOD</button>
`:""}

${p.fase==="fiod"?`
<button onclick="encerrar(${p.id})">Encerrar Processo</button>
`:""}

</div>`;
});

dash.innerHTML=`
<div class="box">🔴 Vencidos<br>${cont.vencido}</div>
<div class="box">🟠 Vence Amanhã<br>${cont.amanha}</div>
<div class="box">🟡 Em Prazo<br>${cont.prazo}</div>
<div class="box">🔵 Aguardando FIOD<br>${cont.aguardando}</div>
<div class="box">🟣 FIOD<br>${cont.fiod}</div>
<div class="box">⚫ Encerrados<br>${cont.encerrado}</div>
`;
}

function entregue(id){
let dados=JSON.parse(localStorage.getItem("processos"));
dados.find(p=>p.id===id).fase="entregue";
localStorage.setItem("processos",JSON.stringify(dados));
carregar();
}

function revelia(id){
let dados=JSON.parse(localStorage.getItem("processos"));
dados.find(p=>p.id===id).fase="revelia";
localStorage.setItem("processos",JSON.stringify(dados));
carregar();
}

function registrarFIOD(id){
let dados=JSON.parse(localStorage.getItem("processos"));
let p=dados.find(x=>x.id===id);
p.fiodPrazo=calcularPrazo(new Date().toISOString().split("T")[0]);
p.fase="fiod";
localStorage.setItem("processos",JSON.stringify(dados));
carregar();
}

function encerrar(id){
let dados=JSON.parse(localStorage.getItem("processos"));
dados.find(p=>p.id===id).fase="encerrado";
localStorage.setItem("processos",JSON.stringify(dados));
carregar();
}

function excluir(id){
if(!confirm("Excluir registro?")) return;
let dados=JSON.parse(localStorage.getItem("processos"));
dados=dados.filter(p=>p.id!==id);
localStorage.setItem("processos",JSON.stringify(dados));
carregar();
}

function toggleHistorico(){
modo=modo==="ativos"?"historico":"ativos";
carregar();
}

</script>

</body>
</html>
